# File: common/gui/gnome.nix
# File: common/gui/kde.nix
# Defines the keyboard layout
export KEY_LAYOUT=it

# File: common/gui/hyprland.nix
# Defines the default font for Hyprland
export FONT=nerd-fonts.code-new-roman

# File: common/packages/default_packages_services.nix
# SSH service configuration
export SSH_PORT=22 # Default SSH port for remote access

# File: common/config/system.nix
# General system configuration shared across environments
export TIMEZONE=Europe/Rome # Timezone configuration for the system
export DEFAULT_LOCALE=it_IT.UTF-8 # Default locale for the system
export CONSOLE_KEY_LAYOUT=it2 # Console keyboard layout (e.g., for TTY sessions)

# File: hosts/ABC/configuration.nix
# NixOS release the host was FIRST installed with (system.stateVersion).
# Per host on purpose: different hosts may have been installed with different releases.
export NIXOS_VERSION=26.05

# File: hosts/ABC/configuration.nix
# Host-specific configuration for the machine identified as "ABC", example
export HOSTNAME=nixos # Hostname for the machine, example

# File: hosts/disk_configurations/*.nix
# Defines the target disk device for installation
export DISK_DEVICE=sda # Target disk device (e.g., sda, nvme0n1, etc.)

# File: users/XYZ/user.nix
# User-specific configuration for the user identified as "XYZ", example
export USER=nixuser # Default Username for the user
# NOTE: the user's password hash and the WiFi pre-shared keys are NOT set here
# anymore: they live sops-encrypted in nixos_configs/secrets/common.yaml
# (keys "user_hashedPassword" and "wifi_env"). See nixos_configs_template/common/config/SECRETS.md for the guide.
export DICTIONARY=it_IT # Default dictionary locale for the user
export BASEPATHUSER=/home # Base path for user-specific configurations
