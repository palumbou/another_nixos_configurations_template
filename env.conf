# Public configuration parameters. Never store passwords, hashes, PSKs or private keys here.
# Assignments are simple KEY=value data; quoted values may contain spaces.


# Host composition: client or server; none selects no local desktop.
export HOST_ROLE=client
export HOSTNAME=nixos
export DESKTOP=none
export FEATURES=''

# Account identities: admin/worker UIDs differ; all primary/shared GIDs differ.
export ADMIN_USER=admin
export ADMIN_UID=1000
export ADMIN_GID=1000
export WORKER_USER=worker
export WORKER_UID=1100
export WORKER_GID=1100
export WORK_GROUP=worker-work
export WORK_GID=1200
export WORK_ROOT=/srv/worker

# Localization, package font attribute and initial installation release.
export TIMEZONE=Europe/Rome
export DEFAULT_LOCALE=it_IT.UTF-8
export KEY_LAYOUT=it
export FONT=nerd-fonts.code-new-roman
export NIXOS_VERSION=26.05

# CIDRs are comma separated. Workers require SSH CIDRs; clients keep native SSH openings when empty.
export SSH_PORT=22
export SSH_ALLOWED_CIDRS=''
export DICTIONARY=it_IT
export BASEPATHUSER=/home

# Optional remote Xfce desktop; empty RDP CIDRs inherit SSH CIDRs.
export ENABLE_RDP=false
export RDP_PORT=3389
export RDP_ALLOWED_CIDRS=''

# Optional host WiFi profile. Its PSK belongs only in encrypted wifi_env.
export ENABLE_WIFI=false
export WIFI_SSID=''

# Optional outgoing synchronization. Device ID needs a fixed tcp endpoint; no incoming port is opened.
export ENABLE_SYNCTHING=false
export SYNCTHING_DEVICE_ID=''
export SYNCTHING_ADDRESS=dynamic
export SYNCTHING_FOLDER_PATH=''
export SYNCTHING_FOLDER_ID=work-data

# Optional storage and power policy; select only for supported hardware/filesystems.
export ENABLE_SNAPSHOTS=false
export ENABLE_SCRUB=false
export ENABLE_BTRFS_ASSISTANT=false
export ENABLE_BATTERY=false
# Empty build limits use client 4/0 or server 2/4 (max jobs / cores per build).
export MAX_JOBS=''
export BUILD_CORES=''

# Empty zram settings use client 30/lz4 or server 50/zstd.
export ENABLE_ZRAM=true
export ZRAM_PERCENT=''
export ZRAM_ALGORITHM=''

# Empty layout selects UEFI ext4 for clients or Btrfs/LUKS for servers.
# none requires a separate hardware declaration with destination filesystem settings.
export DISK_LAYOUT=''
export DISK_DEVICE=sda
export SWAP_SIZE=16G
export BOOT_LOADER=systemd-boot

# Generic hardware declarations. Check the destination hardware before installation.
export CPU_VENDOR=generic
export PLATFORM=x86_64-linux
# Optional generic charge thresholds: none or thresholds, for supported hardware.
export CHARGE_LIMIT_MODE=none
export CHARGE_START_THRESHOLD=75
export CHARGE_STOP_THRESHOLD=80
